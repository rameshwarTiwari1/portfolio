              - paragraph [ref=f1e107]: Photos are now trivially generated and trivially edited, which makes "is this real?" a question no viewer can answer by looking. Vashix moves the proof to the moment of capture, signing on-device against C2PA 2.1 and scoring how far that signature can be trusted.
