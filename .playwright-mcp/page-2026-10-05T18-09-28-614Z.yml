              - heading "Vashix" [level=3] [ref=f1e97]
              - paragraph [ref=f1e98]: Hardware-signs photo and video at the moment of capture, so an image can prove who took it, where, when, and that nobody has touched it since.
              - generic [ref=f1e99]:
                - generic [ref=f1e100]:
                  - text: Role
                  - generic [ref=f1e101]: Solo architect and engineer
                - generic [ref=f1e102]:
